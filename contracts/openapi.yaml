# RASCUNHO: rotas já listadas no plano. Corpos, respostas e CSRF são definidos na T-05.
openapi: 3.1.0
info:
  title: SkillQuest
  version: 0.0.0-rascunho
security:
  - session: []
paths:
  /api/invitations/{token}/accept:
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Cria a senha
      x-used-by: Convidado
      security: []
      responses:
        '201':
          description: A definir na T-05.
        default:
          $ref: '#/components/responses/Error'
  /api/session:
    post:
      summary: Entra
      x-used-by: Todos
      security: []
      responses:
        '201':
          description: A definir na T-05.
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: Sai
      x-used-by: Todos
      responses:
        '204':
          description: A definir na T-05.
        default:
          $ref: '#/components/responses/Error'
  /api/dashboard:
    get:
      summary: Traz trilhas e desafio atual
      x-used-by: Participante
      responses:
        '200':
          description: A definir na T-05.
        default:
          $ref: '#/components/responses/Error'
  /api/challenges/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Traz cenário, critérios e dicas já liberadas
      x-used-by: Participante
      responses:
        '200':
          description: A definir na T-05.
        default:
          $ref: '#/components/responses/Error'
  /api/challenges/{id}/hints:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Libera a próxima dica
      x-used-by: Participante
      responses:
        '200':
          description: A definir na T-05.
        default:
          $ref: '#/components/responses/Error'
  /api/challenges/{id}/submissions:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Recebe a entrega em .zip
      x-used-by: Participante
      responses:
        '202':
          description: A definir na T-05.
        default:
          $ref: '#/components/responses/Error'
  /api/submissions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Mostra o andamento e o resultado
      x-used-by: Dono ou supervisão
      responses:
        '200':
          description: A definir na T-05.
        default:
          $ref: '#/components/responses/Error'
  /api/submissions/{id}/appeal:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Pede revisão humana
      x-used-by: Dono
      responses:
        '201':
          description: A definir na T-05.
        default:
          $ref: '#/components/responses/Error'
  /api/profile:
    get:
      summary: Traz competências e itens
      x-used-by: Participante
      responses:
        '200':
          description: A definir na T-05.
        default:
          $ref: '#/components/responses/Error'
  /api/supervision/queue:
    get:
      summary: Lista os casos pendentes
      x-used-by: Supervisão
      responses:
        '200':
          description: A definir na T-05.
        default:
          $ref: '#/components/responses/Error'
  /api/supervision/reviews/{id}/decision:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Registra a decisão e a justificativa
      x-used-by: Supervisão
      responses:
        '201':
          description: A definir na T-05.
        default:
          $ref: '#/components/responses/Error'
  /api/supervision/invitations:
    post:
      summary: Gera um convite ou um link para nova senha
      x-used-by: Supervisão
      responses:
        '201':
          description: A definir na T-05.
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: session  # nome provisório
  responses:
    Error:
      description: Erro. Formato provisório.
      content:
        application/json:
          schema:
            type: object
            required: [reason]
            properties:
              field: { type: string }
              reason: { type: string }
